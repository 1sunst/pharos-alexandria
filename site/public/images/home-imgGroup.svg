@keyframes compass-orbit{to{transform:rotate(360deg)}}
@keyframes compass-float{0%,100%{transform:translateY(0)}50%{transform:translateY(2px)}}
@media(prefers-reduced-motion:reduce){.compass-rotate,.compass-inner,.compass-bob,.compass-dotted,.compass-grey-lines{animation:none}}
</style>
